<text x="41" y="467" font-size="11" fill="#000000" text-anchor="middle">完成</text>
<circle cx="125" cy="463" r="26" fill="none" stroke="#FFFFFF" stroke-width="3"/>
<circle cx="125" cy="463" r="18" fill="#CAC2D1"/>
<text x="125" y="505" font-size="10" fill="#8E8E93" text-anchor="middle">短按连线 · 长按断开</text>
<rect x="180" y="448" width="58" height="30" rx="8" fill="none" stroke="#3A3A3E" stroke-width="1"/>
