<circle cx="157" cy="125" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<circle cx="176" cy="140" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<circle cx="226" cy="140" r="3.5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<line x1="101" y1="125" x2="111" y2="125" stroke="#FFFFFF" stroke-width="1.5"/>
<line x1="115" y1="125" x2="125" y2="125" stroke="#FFFFFF" stroke-width="1.5"/>
<line x1="113" y1="113" x2="113" y2="123" stroke="#FFFFFF" stroke-width="1.5"/>
<line x1="113" y1="127" x2="113" y2="137" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="113" cy="125" r="12" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="113" cy="125" r="2.5" fill="#CAC2D1"/>
</g>
<text x="14" y="336" font-size="11" fill="#8E8E93">面向南，从右（西）向左（东）依次拍</text>
<path d="M 14 344 L 22 344 L 18 350 Z" fill="#CAC2D1"/>
<text x="28" y="352" font-size="11" fill="#CAC2D1">短按连线 · 长按经地平线断开为空隙</text>
<text x="14" y="368" font-size="10" fill="#8E8E93">东·后拍</text>
