<rect x="194" y="372" width="44" height="20" rx="10" fill="none" stroke="#3A3A3E" stroke-width="1"/>
<text x="216" y="386" font-size="10" fill="#8E8E93" text-anchor="middle">显示线</text>
<rect x="12" y="392" width="226" height="12" rx="6" fill="#1C1C1E" stroke="#2E2E32" stroke-width="0.5"/>
<rect x="37" y="392" width="176" height="12" rx="6" fill="#FFFFFF"/>
<text x="24" y="416" font-size="11" fill="#8E8E93" text-anchor="middle">90°</text>
