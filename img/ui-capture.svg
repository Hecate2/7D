<svg viewBox="0 0 250 540" width="500" height="1080" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" role="img">
<title>采集界面</title>
<desc>采集草图：默认外部建筑区，取景器左上 chip 可切到天花板区。面向南从右（西）向左（东）依次拍。外部区短按连线、长按经地平线断开，未拍方位视为开阔；天花板区只支持短按连窗框上沿，未拍方位视为墙体全遮挡。取景器默认显示太阳轨迹线、今日轨迹上那枚跟着钟走的「此刻太阳」金点与拍摄点连线。覆盖条只计外部区 90 到 270 度。左下完成键；右下删除键须长按，删十字线右边最近的一点，单次只删1点。照片自动保存无开关；方位默认+180°可切。真北由GPS经纬度经GeomagneticField自动校正。</desc>
<rect x="1" y="1" width="248" height="538" rx="28" fill="#000000" stroke="#2E2E32" stroke-width="1"/>
<text x="14" y="30" font-size="15" font-weight="600" fill="#FFFFFF">采集</text>
<text x="236" y="30" font-size="11" fill="#8E8E93" text-anchor="end">阳台</text>
<text x="14" y="48" font-size="10.5" fill="#8E8E93">121.47°E 31.23°N · 真北已校正 · 罗盘精度高</text>
<text x="14" y="70" font-size="15" font-weight="500" fill="#FFFFFF">仰角 <tspan fill="#FFFFFF">24.6°</tspan> · 方位 <tspan fill="#FFFFFF">182.1°</tspan></text>
<rect x="196" y="56" width="42" height="18" rx="9" fill="#FFFFFF"/>
<text x="217" y="69" font-size="10" fill="#000000" text-anchor="middle">+180°</text>
<rect x="12" y="78" width="226" height="240" rx="8" fill="#0E0E10" stroke="#2E2E32" stroke-width="1"/>
<g transform="translate(12,78)">
<rect x="8" y="8" width="58" height="20" rx="10" fill="#FFFFFF"/>
<text x="37" y="22" font-size="10" fill="#000000" text-anchor="middle">外部建筑</text>
<rect x="70" y="8" width="48" height="20" rx="10" fill="none" stroke="#FFFFFF" stroke-width="1"/>
<text x="94" y="22" font-size="10" fill="#FFFFFF" text-anchor="middle">天花板</text>
<line x1="120" y1="8" x2="214" y2="8" stroke="#EF9F27" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M 210 6 L 214 1 L 218 6" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="226" y="24" font-size="10" fill="#EF9F27" text-anchor="end">夏至轨迹（画面外上方）</text>
<polyline points="0,80 56.5,52 113,45 169.5,53 226,84" fill="none" stroke="#E24B4A" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>
<text x="113" y="38" font-size="10" fill="#E24B4A" text-anchor="middle">春分·秋分轨迹</text>
<polyline points="0,82.5 56.5,56 113,49.5 169.5,57 226,86.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
<text x="196" y="50" font-size="10" fill="#FFFFFF" text-anchor="middle">今日轨迹</text>
<circle cx="140" cy="53" r="3.5" fill="#FFC107" stroke="#000000" stroke-width="1"/>
<text x="152" y="66" font-size="8" fill="#FFC107" text-anchor="middle">此刻太阳</text>
<polyline points="0,86.6 56.5,70 113,66.1 169.5,71.1 226,89.4" fill="none" stroke="#378ADD" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>
<text x="113" y="62" font-size="10" fill="#378ADD" text-anchor="middle">冬至轨迹</text>
